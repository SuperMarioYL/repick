<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 683" role="img" aria-labelledby="title desc"><title id="title">repick core process — align the tasks and compare recorded outcomes</title><desc id="desc">The supplied traces contain three matching tasks. Candidate-minus-baseline durations are minus 15, minus 24 and minus 12 seconds; all three verdicts are candidate-wins. Durations are synthetic trace inputs, not a live performance measurement. Tasks without a match receive no pairwise verdict.</desc><defs><radialGradient id="halo"><stop stop-color="#5a99ff" stop-opacity=".27"/><stop offset="1" stop-color="#070c1d" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#58e5f5"/><stop offset=".55" stop-color="#7197ff"/><stop offset="1" stop-color="#b498ff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294771" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:440px 316px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,6px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="880" height="683" rx="18" fill="#070c1d"/><rect x="1" y="1" width="878" height="681" rx="17" fill="url(#grid)" stroke="#294771" stroke-opacity=".6"/><text x="40" y="51" font-size="29" fill="#f1f6ff" font-weight="600" text-anchor="start" >SAME TASK. TWO RECORDED CHOICES.</text><text x="40" y="84" font-size="21" fill="#a8bbdb" font-weight="400" text-anchor="start" >Supplied fixture values · comparison output</text><text x="43" y="131" font-size="21" fill="#58e5f5" font-weight="600" text-anchor="start" >01  RECORD A</text><text x="369" y="131" font-size="21" fill="#a8bbdb" font-weight="600" text-anchor="start" >02  MATCH</text><text x="644" y="131" font-size="21" fill="#b498ff" font-weight="600" text-anchor="start" >03  COMPARE B</text><line x1="40" y1="148" x2="840" y2="148" stroke="#294771" stroke-width="1.4" /><text x="40" y="178" font-size="23" fill="#a8bbdb" font-weight="500" text-anchor="start" >refactor-auth-module</text><rect x="40" y="197" width="245" height="60" rx="8" fill="#0d1731" stroke="#58e5f5" /><text x="57" y="236" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >grep</text><text x="268" y="236" font-size="25" fill="#58e5f5" font-weight="400" text-anchor="end" >24 s ✓</text><rect x="522" y="197" width="318" height="60" rx="8" fill="#0d1731" stroke="#b498ff" /><text x="539" y="236" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >lsp-symbol</text><text x="822" y="236" font-size="25" fill="#b498ff" font-weight="400" text-anchor="end" >9 s ✓</text><line x1="285" y1="227" x2="522" y2="227" stroke="#294771" stroke-width="1.5" /><path d="M285 227H522" fill="none" stroke="#7197ff" stroke-width="3" class="route later"/><circle cx="403" cy="227" r="28" fill="#070c1d" stroke="#7197ff" stroke-width="1.7"/><text x="403" y="236" font-size="31" fill="#f1f6ff" font-weight="500" text-anchor="middle" >↔</text><text x="840" y="289" font-size="23" fill="#b498ff" font-weight="500" text-anchor="end" >−15 s  /  candidate-wins</text><text x="40" y="308" font-size="23" fill="#a8bbdb" font-weight="500" text-anchor="start" >find-dead-code</text><rect x="40" y="327" width="245" height="60" rx="8" fill="#0d1731" stroke="#58e5f5" /><text x="57" y="366" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >grep</text><text x="268" y="366" font-size="25" fill="#58e5f5" font-weight="400" text-anchor="end" >31 s ×</text><rect x="522" y="327" width="318" height="60" rx="8" fill="#0d1731" stroke="#b498ff" /><text x="539" y="366" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >ripgrep</text><text x="822" y="366" font-size="25" fill="#b498ff" font-weight="400" text-anchor="end" >7 s ✓</text><line x1="285" y1="357" x2="522" y2="357" stroke="#294771" stroke-width="1.5" /><path d="M285 357H522" fill="none" stroke="#7197ff" stroke-width="3" class="route slow"/><circle cx="403" cy="357" r="28" fill="#070c1d" stroke="#7197ff" stroke-width="1.7"/><text x="403" y="366" font-size="31" fill="#f1f6ff" font-weight="500" text-anchor="middle" >↔</text><text x="840" y="419" font-size="23" fill="#b498ff" font-weight="500" text-anchor="end" >−24 s  /  candidate-wins</text><text x="40" y="438" font-size="23" fill="#a8bbdb" font-weight="500" text-anchor="start" >rename-symbol-everywhere</text><rect x="40" y="457" width="245" height="60" rx="8" fill="#0d1731" stroke="#58e5f5" /><text x="57" y="496" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >grep</text><text x="268" y="496" font-size="25" fill="#58e5f5" font-weight="400" text-anchor="end" >18 s ✓</text><rect x="522" y="457" width="318" height="60" rx="8" fill="#0d1731" stroke="#b498ff" /><text x="539" y="496" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start" >lsp-symbol</text><text x="822" y="496" font-size="25" fill="#b498ff" font-weight="400" text-anchor="end" >6 s ✓</text><line x1="285" y1="487" x2="522" y2="487" stroke="#294771" stroke-width="1.5" /><path d="M285 487H522" fill="none" stroke="#7197ff" stroke-width="3" class="route later"/><circle cx="403" cy="487" r="28" fill="#070c1d" stroke="#7197ff" stroke-width="1.7"/><text x="403" y="496" font-size="31" fill="#f1f6ff" font-weight="500" text-anchor="middle" >↔</text><text x="840" y="549" font-size="23" fill="#b498ff" font-weight="500" text-anchor="end" >−12 s  /  candidate-wins</text><line x1="40" y1="577" x2="840" y2="577" stroke="#294771" stroke-width="1.4" /><text x="40" y="610" font-size="23" fill="#a8bbdb" font-weight="400" text-anchor="start" >✓ resolved   × unresolved</text><text x="40" y="650" font-size="23" fill="#a8bbdb" font-weight="400" text-anchor="start" >Unmatched tasks receive no pairwise verdict.</text></svg>
