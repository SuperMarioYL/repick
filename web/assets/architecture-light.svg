<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 646" role="img" aria-labelledby="title desc"><title id="title">repick architecture — exported traces to local A/B reports</title><desc id="desc">Two format adapters produce ToolDecision records. The CLI appends them to .repick run files. The A/B engine reads those records, joins task signatures, and renders Markdown summaries and per-task differences.</desc><defs><radialGradient id="halo"><stop stop-color="#9bc3ff" stop-opacity=".27"/><stop offset="1" stop-color="#f0f5ff" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#007f99"/><stop offset=".55" stop-color="#2755c7"/><stop offset="1" stop-color="#7143c3"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a6bbdc" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:440px 316px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,6px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="880" height="646" rx="18" fill="#f0f5ff"/><rect x="1" y="1" width="878" height="644" rx="17" fill="url(#grid)" stroke="#a6bbdc" stroke-opacity=".6"/><text x="40" y="52" font-size="30" fill="#172a4c" font-weight="600" text-anchor="start" >ONE MODEL. TWO INPUT FORMATS.</text><text x="40" y="85" font-size="20" fill="#4b6588" font-weight="400" text-anchor="start" >Real modules behind the local comparison</text><path d="M48 133L790 133L831 170L89 170Z" fill="#e0ebff" stroke="#a6bbdc"/><rect x="58" y="116" width="339" height="72" rx="12" fill="#ffffff" stroke="#007f99" /><text x="78" y="147" font-size="26" fill="#172a4c" font-weight="600" text-anchor="start" >Claude-format JSONL</text><text x="78" y="175" font-size="18" fill="#4b6588" font-weight="400" text-anchor="start" >ingest/claude_code.ts</text><rect x="459" y="116" width="363" height="72" rx="12" fill="#ffffff" stroke="#7143c3" /><text x="479" y="147" font-size="26" fill="#172a4c" font-weight="600" text-anchor="start" >Codex-format JSONL</text><text x="479" y="175" font-size="18" fill="#4b6588" font-weight="400" text-anchor="start" >ingest/codex.ts</text><path d="M227 189V228H440V247" fill="none" stroke="#007f99" stroke-width="2" /><path d="M227 189V228H440V247" fill="none" stroke="#007f99" stroke-width="3" class="route"/><path d="M642 189V228H440V247" fill="none" stroke="#7143c3" stroke-width="2" /><path d="M642 189V228H440V247" fill="none" stroke="#7143c3" stroke-width="3" class="route"/><rect x="166" y="248" width="548" height="102" rx="12" fill="#e0ebff" stroke="#2755c7" /><text x="440" y="288" font-size="36" fill="#172a4c" font-weight="600" text-anchor="middle" >ToolDecision</text><text x="440" y="323" font-size="24" fill="#007f99" font-weight="400" text-anchor="middle" >task_sig · tool · outcome</text><path d="M440 350V384H227V409" fill="none" stroke="#007f99" stroke-width="2" /><path d="M440 350V384H652V409" fill="none" stroke="#7143c3" stroke-width="2" /><path d="M440 350V384H227V409" fill="none" stroke="#007f99" stroke-width="3" class="route slow"/><rect x="54" y="410" width="346" height="137" rx="12" fill="#ffffff" stroke="#007f99" /><ellipse cx="227" cy="425" rx="173" ry="17" fill="#e0ebff" stroke="#007f99"/><text x="227" y="477" font-size="27" fill="#172a4c" font-weight="600" text-anchor="middle" >Local JSONL ledger</text><text x="227" y="516" font-size="20" fill="#4b6588" font-weight="400" text-anchor="middle" >.repick/&lt;runId&gt;.jsonl</text><rect x="479" y="410" width="347" height="137" rx="12" fill="#ffffff" stroke="#7143c3" /><text x="652" y="453" font-size="29" fill="#172a4c" font-weight="600" text-anchor="middle" >A/B engine</text><text x="652" y="491" font-size="24" fill="#4b6588" font-weight="400" text-anchor="middle" >Join by task_sig</text><text x="652" y="526" font-size="20" fill="#7143c3" font-weight="400" text-anchor="middle" >replay/ab.ts</text><path d="M400 479H479" fill="none" stroke="#007f99" stroke-width="2" /><circle cx="438" cy="479" r="4" fill="#007f99" class="pulse"/><path d="M652 549V579H227" fill="none" stroke="#2755c7" stroke-width="2" class="route"/><text x="40" y="610" font-size="17" fill="#4b6588" font-weight="500" text-anchor="start" >OUTPUT</text><text x="162" y="610" font-size="28" fill="#172a4c" font-weight="500" text-anchor="start" >Markdown table + per-task diff</text></svg>
