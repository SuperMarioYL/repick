25" font-size="30" text-anchor="start" font-weight="400">Exported traces in, inspectable reports out</text><ellipse cx="500" cy="337" rx="238" ry="176" fill="none" stroke="#cbf7e0"/><ellipse cx="500" cy="337" rx="193" ry="144" fill="none" stroke="#cbf7e0" stroke-dasharray="2 9"/><circle cx="500" cy="337" r="68" fill="#f7fefa" stroke="#318257"/><text x="500" y="348" fill="#318257" font-size="34" text-anchor="middle" font-weight="700">RE</text><path d="M276 211H390V337H432" fill="none" stroke="#318257" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 211H390V337H432" class="flow" fill="none" stroke="#577d5b" stroke-width="2"/><rect x="40" y="156" width="236" height="112" rx="12" fill="#f7fefa" stroke="#cbf7e0"/><text x="58" y="187.0" fill="#132a25" font-size="21" text-anchor="start" font-weight="400">Claude schema</text><text x="58" y="239.0" fill="#557b78" font-size="17" text-anchor="start" font-weight="400">Local JSONL adapter</text><path d="M568 337H662V211H724" fill="none" stroke="#318257" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M568 337H662V211H724" class="flow" fill="none" stroke="#577d5b" stroke-width="2"/><rect x="724" y="156" width="236" height="112" rx="12" fill="#f7fefa" stroke="#cbf7e0"/><text x="742" y="187.0" fill="#132a25" font-size="21" text-anchor="start" font-weight="400">Codex schema</text><text x="742" y="239.0" fill="#557b78" font-size="17" text-anchor="start" font-weight="400">Local JSONL adapter</text><path d="M276 357H390V337H432" fill="none" stroke="#318257" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 357H390V337H432" class="flow" fill="none" stroke="#577d5b" stroke-width="2"/><rect x="40" y="302" width="236" height="112" rx="12" fill="#f7fefa" stroke="#cbf7e0"/><text x="58" y="333.0" fill="#132a25" font-size="21" text-anchor="start" font-weight="400">Standard input</text><text x="58" y="385.0" fill="#557b78" font-size="17" text-anchor="start" font-weight="400">Pipe exported events</text><path d="M568 337