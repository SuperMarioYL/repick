<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 953" role="img" aria-labelledby="title desc"><title id="title">repick core process — align the tasks and compare recorded outcomes</title><desc id="desc">The supplied traces contain three matching tasks. Candidate-minus-baseline durations are minus 15, minus 24 and minus 12 seconds; all three verdicts are candidate-wins. Durations are synthetic trace inputs, not a live performance measurement. Tasks without a match receive no pairwise verdict.</desc><defs><radialGradient id="halo"><stop stop-color="#5a99ff" stop-opacity=".32"/><stop offset="1" stop-color="#070c1d" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#58e5f5"/><stop offset=".55" stop-color="#7197ff"/><stop offset="1" stop-color="#b498ff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#294771" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:200px 474px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="400" height="953" rx="16" fill="#070c1d"/><rect x="1" y="1" width="398" height="951" rx="15" fill="url(#grid)" stroke="#294771" stroke-opacity=".6"/><text x="24" y="40" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start">SAME TASK.</text><text x="24" y="75" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="start">TWO RECORDED CHOICES.</text><text x="24" y="109" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="start">Supplied fixture values</text><text x="24" y="136" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="start">Comparison output</text><text x="24" y="181" font-size="16" fill="#58e5f5" font-weight="600" text-anchor="start">01 RECORD A</text><text x="159" y="181" font-size="16" fill="#a8bbdb" font-weight="600" text-anchor="start">02 MATCH</text><text x="264" y="181" font-size="16" fill="#b498ff" font-weight="600" text-anchor="start">03 COMPARE B</text><line x1="24" y1="194" x2="376" y2="194" stroke="#294771" stroke-width="1.4" /><text x="24" y="227" font-size="18" fill="#a8bbdb" font-weight="500" text-anchor="start">refactor-auth-module</text><rect x="24" y="246" width="152" height="92" rx="9" fill="#0d1731" stroke="#58e5f5"/><rect x="224" y="246" width="152" height="92" rx="9" fill="#0d1731" stroke="#b498ff"/><text x="38" y="278" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">grep</text><text x="38" y="315" font-size="25" fill="#58e5f5" font-weight="500" text-anchor="start">24 s ✓</text><text x="238" y="278" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">lsp-symbol</text><text x="238" y="315" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">9 s ✓</text><path d="M176 292H224" fill="none" stroke="#7197ff" stroke-width="2" class="route"/><circle cx="200" cy="292" r="17" fill="#070c1d" /><text x="200" y="300" font-size="26" fill="#f1f6ff" font-weight="500" text-anchor="middle">↔</text><text x="24" y="375" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">−15 s</text><text x="376" y="375" font-size="18" fill="#b498ff" font-weight="500" text-anchor="end">candidate-wins</text><text x="24" y="432" font-size="18" fill="#a8bbdb" font-weight="500" text-anchor="start">find-dead-code</text><rect x="24" y="451" width="152" height="92" rx="9" fill="#0d1731" stroke="#58e5f5"/><rect x="224" y="451" width="152" height="92" rx="9" fill="#0d1731" stroke="#b498ff"/><text x="38" y="483" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">grep</text><text x="38" y="520" font-size="25" fill="#58e5f5" font-weight="500" text-anchor="start">31 s ×</text><text x="238" y="483" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">ripgrep</text><text x="238" y="520" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">7 s ✓</text><path d="M176 497H224" fill="none" stroke="#7197ff" stroke-width="2" class="route"/><circle cx="200" cy="497" r="17" fill="#070c1d" /><text x="200" y="505" font-size="26" fill="#f1f6ff" font-weight="500" text-anchor="middle">↔</text><text x="24" y="580" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">−24 s</text><text x="376" y="580" font-size="18" fill="#b498ff" font-weight="500" text-anchor="end">candidate-wins</text><text x="24" y="637" font-size="18" fill="#a8bbdb" font-weight="500" text-anchor="start">rename-symbol-everywhere</text><rect x="24" y="656" width="152" height="92" rx="9" fill="#0d1731" stroke="#58e5f5"/><rect x="224" y="656" width="152" height="92" rx="9" fill="#0d1731" stroke="#b498ff"/><text x="38" y="688" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">grep</text><text x="38" y="725" font-size="25" fill="#58e5f5" font-weight="500" text-anchor="start">18 s ✓</text><text x="238" y="688" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">lsp-symbol</text><text x="238" y="725" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">6 s ✓</text><path d="M176 702H224" fill="none" stroke="#7197ff" stroke-width="2" class="route"/><circle cx="200" cy="702" r="17" fill="#070c1d" /><text x="200" y="710" font-size="26" fill="#f1f6ff" font-weight="500" text-anchor="middle">↔</text><text x="24" y="785" font-size="25" fill="#b498ff" font-weight="500" text-anchor="start">−12 s</text><text x="376" y="785" font-size="18" fill="#b498ff" font-weight="500" text-anchor="end">candidate-wins</text><line x1="24" y1="824" x2="376" y2="824" stroke="#294771" stroke-width="1.4" /><text x="24" y="858" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">✓ resolved   × unresolved</text><text x="24" y="900" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">Unmatched tasks receive</text><text x="24" y="928" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">no pairwise verdict.</text></svg>
