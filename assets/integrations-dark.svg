<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-labelledby="title desc"><title id="title">repick capabilities — implemented input and output routes</title><desc id="desc">Repick v0.1.0 accepts its Claude-format and Codex-format JSONL schemas or standard input, stores a local JSONL ledger and outputs Markdown tool tables and verbose task details. These are exported-trace adapters, not live connections to coding agents.</desc><defs><radialGradient id="halo"><stop stop-color="#5a99ff" stop-opacity=".27"/><stop offset="1" stop-color="#070c1d" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#58e5f5"/><stop offset=".55" stop-color="#7197ff"/><stop offset="1" stop-color="#b498ff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294771" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:440px 316px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,6px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="880" height="640" rx="18" fill="#070c1d"/><rect x="1" y="1" width="878" height="638" rx="17" fill="url(#grid)" stroke="#294771" stroke-opacity=".6"/><text x="40" y="51" font-size="29" fill="#f1f6ff" font-weight="600" text-anchor="start" >YOUR TRACES IN. LOCAL REPORTS OUT.</text><text x="40" y="84" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="start" >Implemented routes in v0.1.0</text><ellipse cx="440" cy="316" rx="289" ry="165" fill="none" stroke="#294771" stroke-width="1.4"/><circle cx="440" cy="316" r="122" fill="url(#halo)"/><circle cx="440" cy="316" r="85" fill="#142443" stroke="url(#identity)" stroke-width="2"/><text x="440" y="309" font-size="37" fill="#f1f6ff" font-weight="600" text-anchor="middle" >repick</text><text x="440" y="343" font-size="23" fill="#58e5f5" font-weight="400" text-anchor="middle" >record · ab</text><line x1="359.9" y1="284.6" x2="157" y2="205" stroke="#58e5f5" stroke-width="1.2" opacity=".45"/><path d="M359.9 284.6L157 205" fill="none" stroke="#58e5f5" stroke-width="2" class="route " opacity=".65"/><rect x="42" y="169" width="230" height="78" rx="15" fill="#0d1731" stroke="#58e5f5" /><text x="157" y="202" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Claude format</text><text x="157" y="232" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >JSONL input</text><line x1="440.0" y1="230.0" x2="440" y2="148" stroke="#b498ff" stroke-width="1.2" opacity=".45"/><path d="M440.0 230.0L440 148" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".65"/><rect x="325" y="112" width="230" height="78" rx="15" fill="#0d1731" stroke="#b498ff" /><text x="440" y="145" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Codex format</text><text x="440" y="175" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >JSONL input</text><line x1="520.1" y1="284.6" x2="723" y2="205" stroke="#58e5f5" stroke-width="1.2" opacity=".45"/><path d="M520.1 284.6L723 205" fill="none" stroke="#58e5f5" stroke-width="2" class="route " opacity=".65"/><rect x="608" y="169" width="230" height="78" rx="15" fill="#0d1731" stroke="#58e5f5" /><text x="723" y="202" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Standard input</text><text x="723" y="232" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >--trace -</text><line x1="519.5" y1="348.9" x2="723" y2="433" stroke="#b498ff" stroke-width="1.2" opacity=".45"/><path d="M519.5 348.9L723 433" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".65"/><rect x="608" y="397" width="230" height="78" rx="15" fill="#0d1731" stroke="#b498ff" /><text x="723" y="430" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Markdown</text><text x="723" y="460" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >tool table</text><line x1="440.0" y1="402.0" x2="440" y2="502" stroke="#58e5f5" stroke-width="1.2" opacity=".45"/><path d="M440.0 402.0L440 502" fill="none" stroke="#58e5f5" stroke-width="2" class="route " opacity=".65"/><rect x="325" y="466" width="230" height="78" rx="15" fill="#0d1731" stroke="#58e5f5" /><text x="440" y="499" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Task detail</text><text x="440" y="529" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >--verbose</text><line x1="360.5" y1="348.9" x2="157" y2="433" stroke="#b498ff" stroke-width="1.2" opacity=".45"/><path d="M360.5 348.9L157 433" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".65"/><rect x="42" y="397" width="230" height="78" rx="15" fill="#0d1731" stroke="#b498ff" /><text x="157" y="430" font-size="24" fill="#f1f6ff" font-weight="600" text-anchor="middle" >Local ledger</text><text x="157" y="460" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle" >one file / run</text><g class="orbit"><circle cx="440" cy="117" r="4" fill="#58e5f5" /><circle cx="440" cy="515" r="3" fill="#b498ff" /></g><line x1="40" y1="571" x2="840" y2="571" stroke="#294771" stroke-width="1.4" /><text x="40" y="611" font-size="23" fill="#a8bbdb" font-weight="400" text-anchor="start" >Trace schemas are inputs, not live agent connections.</text></svg>
