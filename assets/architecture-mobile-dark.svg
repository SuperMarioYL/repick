<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 929" role="img" aria-labelledby="title desc"><title id="title">repick architecture — exported traces to local A/B reports</title><desc id="desc">Two format adapters produce ToolDecision records. The CLI appends them to .repick run files. The A/B engine reads those records, joins task signatures, and renders Markdown summaries and per-task differences.</desc><defs><radialGradient id="halo"><stop stop-color="#5a99ff" stop-opacity=".32"/><stop offset="1" stop-color="#070c1d" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#58e5f5"/><stop offset=".55" stop-color="#7197ff"/><stop offset="1" stop-color="#b498ff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#294771" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:200px 474px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="400" height="929" rx="16" fill="#070c1d"/><rect x="1" y="1" width="398" height="927" rx="15" fill="url(#grid)" stroke="#294771" stroke-opacity=".6"/><text x="24" y="40" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start">ONE MODEL.</text><text x="24" y="74" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start">TWO INPUT FORMATS.</text><text x="24" y="107" font-size="16" fill="#a8bbdb" font-weight="400" text-anchor="start">Real modules behind the local comparison</text><path d="M20 154H361L381 177H40Z" fill="#142443" stroke="#294771"/><rect x="24" y="139" width="168" height="139" rx="12" fill="#0d1731" stroke="#58e5f5"/><text x="36" y="170" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="start">Claude-format</text><text x="36" y="198" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">JSONL</text><text x="36" y="232" font-size="16" fill="#a8bbdb" font-weight="400" text-anchor="start">ingest/</text><text x="36" y="256" font-size="16" fill="#a8bbdb" font-weight="400" text-anchor="start">claude_code.ts</text><rect x="208" y="139" width="168" height="139" rx="12" fill="#0d1731" stroke="#b498ff"/><text x="220" y="170" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="start">Codex-format</text><text x="220" y="198" font-size="21" fill="#f1f6ff" font-weight="600" text-anchor="start">JSONL</text><text x="220" y="232" font-size="16" fill="#a8bbdb" font-weight="400" text-anchor="start">ingest/</text><text x="220" y="256" font-size="16" fill="#a8bbdb" font-weight="400" text-anchor="start">codex.ts</text><path d="M108 278V311H200V337" fill="none" stroke="#58e5f5" stroke-width="2" /><path d="M108 278V311H200V337" fill="none" stroke="#58e5f5" stroke-width="3" class="route"/><path d="M292 278V311H200V337" fill="none" stroke="#b498ff" stroke-width="2" /><path d="M292 278V311H200V337" fill="none" stroke="#b498ff" stroke-width="3" class="route"/><rect x="40" y="338" width="320" height="105" rx="12" fill="#142443" stroke="#7197ff"/><text x="200" y="382" font-size="30" fill="#f1f6ff" font-weight="600" text-anchor="middle">ToolDecision</text><text x="200" y="417" font-size="19" fill="#58e5f5" font-weight="400" text-anchor="middle">task_sig · tool · outcome</text><path d="M200 443V493" fill="none" stroke="#58e5f5" stroke-width="2" /><path d="M200 443V493" fill="none" stroke="#58e5f5" stroke-width="3" class="route slow"/><rect x="40" y="494" width="320" height="123" rx="12" fill="#0d1731" stroke="#58e5f5"/><ellipse cx="200" cy="508" rx="160" ry="15" fill="#142443" stroke="#58e5f5"/><text x="200" y="551" font-size="25" fill="#f1f6ff" font-weight="600" text-anchor="middle">Local JSONL ledger</text><text x="200" y="586" font-size="20" fill="#a8bbdb" font-weight="400" text-anchor="middle">.repick/&lt;runId&gt;.jsonl</text><path d="M200 617V657" fill="none" stroke="#b498ff" stroke-width="2" /><path d="M200 617V657" fill="none" stroke="#b498ff" stroke-width="3" class="route later"/><rect x="40" y="658" width="320" height="124" rx="12" fill="#0d1731" stroke="#b498ff"/><text x="200" y="699" font-size="28" fill="#f1f6ff" font-weight="600" text-anchor="middle">A/B engine</text><text x="200" y="734" font-size="22" fill="#a8bbdb" font-weight="400" text-anchor="middle">Join by task_sig</text><text x="200" y="762" font-size="18" fill="#b498ff" font-weight="400" text-anchor="middle">replay/ab.ts</text><path d="M200 782V816" fill="none" stroke="#7197ff" stroke-width="2" class="route"/><text x="24" y="837" font-size="16" fill="#a8bbdb" font-weight="600" text-anchor="start">OUTPUT</text><text x="24" y="871" font-size="25" fill="#f1f6ff" font-weight="500" text-anchor="start">Markdown table</text><text x="24" y="903" font-size="25" fill="#f1f6ff" font-weight="500" text-anchor="start">+ per-task diff</text></svg>
