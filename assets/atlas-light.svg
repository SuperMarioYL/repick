<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="repick architecture: agent trace -> ingest adapters -> ToolDecision ledger -> A/B replay -> outcome table">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="172" y1="180" x2="193" y2="180" marker-end="url(#ah-l)"/>
    <line x1="347" y1="180" x2="368" y2="180" marker-end="url(#ah-l)"/>
    <line x1="522" y1="180" x2="543" y2="180" marker-end="url(#ah-l)"/>
    <line x1="697" y1="180" x2="718" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (left -> right) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="172" y1="180" x2="190" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="347" y1="180" x2="365" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="522" y1="180" x2="540" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="697" y1="180" x2="715" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets travelling along the connectors -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M172,180 L190,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M347,180 L365,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M522,180 L540,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M697,180 L715,180" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: purple = agent, blue = infra, green = store -->
  <g>
    <rect x="20" y="140" width="150" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="95" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Agent</text>
    <text x="95" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">trace</text>

    <rect x="195" y="140" width="150" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="270" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Ingest</text>
    <text x="270" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">adapters</text>

    <rect x="370" y="140" width="150" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="445" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">ToolDecision</text>
    <text x="445" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">ledger</text>

    <rect x="545" y="140" width="150" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="620" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">A/B</text>
    <text x="620" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">replay</text>

    <rect x="720" y="140" width="150" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="795" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Outcome</text>
    <text x="795" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">table</text>
  </g>

  <text x="440" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">record → ab · m1 ships now  ·  retune → MCP gate · m2 roadmap</text>
</svg>
