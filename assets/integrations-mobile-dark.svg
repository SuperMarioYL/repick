<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 937" role="img" aria-labelledby="title desc"><title id="title">repick capabilities — implemented input and output routes</title><desc id="desc">Repick v0.1.0 accepts its Claude-format and Codex-format JSONL schemas or standard input, stores a local JSONL ledger and outputs Markdown tool tables and verbose task details. These are exported-trace adapters, not live connections to coding agents.</desc><defs><radialGradient id="halo"><stop stop-color="#5a99ff" stop-opacity=".32"/><stop offset="1" stop-color="#070c1d" stop-opacity="0"/></radialGradient><linearGradient id="identity"><stop stop-color="#58e5f5"/><stop offset=".55" stop-color="#7197ff"/><stop offset="1" stop-color="#b498ff"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#294771" stroke-width=".6" opacity=".3"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.route{stroke-dasharray:7 15;animation:route 5s linear infinite}.drift{animation:drift 6s ease-in-out infinite}.orbit{transform-origin:200px 474px;animation:orbit 38s linear infinite}.slow{animation-delay:-2s}.later{animation-delay:-3.5s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes route{to{stroke-dashoffset:-132}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,4px)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.route,.drift,.orbit{animation:none!important;transform:none!important}.pulse{opacity:.8}.route{stroke-dasharray:none}}</style><rect width="400" height="937" rx="16" fill="#070c1d"/><rect x="1" y="1" width="398" height="935" rx="15" fill="url(#grid)" stroke="#294771" stroke-opacity=".6"/><text x="24" y="40" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start">YOUR TRACES IN.</text><text x="24" y="74" font-size="27" fill="#f1f6ff" font-weight="600" text-anchor="start">LOCAL REPORTS OUT.</text><text x="24" y="108" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">Implemented routes in v0.1.0</text><ellipse cx="200" cy="474" rx="122" ry="270" fill="none" stroke="#294771" stroke-width="1.4"/><ellipse cx="200" cy="474" rx="168" ry="196" fill="url(#halo)"/><path d="M200.0 401.0L200 180" fill="none" stroke="#58e5f5" stroke-width="1.3" opacity=".5"/><path d="M200.0 401.0L200 180" fill="none" stroke="#58e5f5" stroke-width="2" class="route later" opacity=".7"/><rect x="90.0" y="138" width="220" height="84" rx="14" fill="#0d1731" stroke="#58e5f5"/><text x="200" y="175" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Claude format</text><text x="200" y="205" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">JSONL input</text><path d="M238.5 412.0L292 326" fill="none" stroke="#b498ff" stroke-width="1.3" opacity=".5"/><path d="M238.5 412.0L292 326" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".7"/><rect x="212.0" y="284" width="160" height="84" rx="14" fill="#0d1731" stroke="#b498ff"/><text x="292" y="321" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Codex format</text><text x="292" y="351" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">JSONL input</text><path d="M236.4 537.3L292 634" fill="none" stroke="#58e5f5" stroke-width="1.3" opacity=".5"/><path d="M236.4 537.3L292 634" fill="none" stroke="#58e5f5" stroke-width="2" class="route later" opacity=".7"/><rect x="212.0" y="592" width="160" height="84" rx="14" fill="#0d1731" stroke="#58e5f5"/><text x="292" y="629" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Standard input</text><text x="292" y="659" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">--trace -</text><path d="M200.0 547.0L200 768" fill="none" stroke="#b498ff" stroke-width="1.3" opacity=".5"/><path d="M200.0 547.0L200 768" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".7"/><rect x="90.0" y="726" width="220" height="84" rx="14" fill="#0d1731" stroke="#b498ff"/><text x="200" y="763" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Markdown</text><text x="200" y="793" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">tool table</text><path d="M163.6 537.3L108 634" fill="none" stroke="#58e5f5" stroke-width="1.3" opacity=".5"/><path d="M163.6 537.3L108 634" fill="none" stroke="#58e5f5" stroke-width="2" class="route later" opacity=".7"/><rect x="28.0" y="592" width="160" height="84" rx="14" fill="#0d1731" stroke="#58e5f5"/><text x="108" y="629" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Task detail</text><text x="108" y="659" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">--verbose</text><path d="M161.5 412.0L108 326" fill="none" stroke="#b498ff" stroke-width="1.3" opacity=".5"/><path d="M161.5 412.0L108 326" fill="none" stroke="#b498ff" stroke-width="2" class="route slow" opacity=".7"/><rect x="28.0" y="284" width="160" height="84" rx="14" fill="#0d1731" stroke="#b498ff"/><text x="108" y="321" font-size="19" fill="#f1f6ff" font-weight="600" text-anchor="middle">Local ledger</text><text x="108" y="351" font-size="17" fill="#a8bbdb" font-weight="400" text-anchor="middle">one file / run</text><circle cx="200" cy="474" r="73" fill="#142443" stroke="url(#identity)" stroke-width="2"/><text x="200" y="465" font-size="33" fill="#f1f6ff" font-weight="600" text-anchor="middle">repick</text><text x="200" y="499" font-size="19" fill="#58e5f5" font-weight="400" text-anchor="middle">record · ab</text><g class="orbit"><circle cx="200" cy="374" r="4" fill="#58e5f5" /><circle cx="200" cy="574" r="3" fill="#b498ff" /></g><line x1="24" y1="844" x2="376" y2="844" stroke="#294771" stroke-width="1.4" /><text x="24" y="881" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">Trace schemas are inputs,</text><text x="24" y="910" font-size="18" fill="#a8bbdb" font-weight="400" text-anchor="start">not live agent connections.</text></svg>
